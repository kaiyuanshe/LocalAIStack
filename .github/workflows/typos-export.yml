name: Temporary typos review export

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install typos CLI
        run: cargo install typos-cli --locked

      - name: Export review JSONL
        shell: bash
        run: |
          set -uo pipefail
          set +e
          typos --format json . > typos-output.jsonl
          typos_status=$?
          set -e
          python3 - <<'PY'
          import json
          from collections import defaultdict

          counts = defaultdict(int)
          with open("typos-output.jsonl", "r", encoding="utf-8") as source, open("review.jsonl", "w", encoding="utf-8") as review:
              for raw in source:
                  raw = raw.strip()
                  if not raw:
                      continue
                  item = json.loads(raw)
                  if "typo" not in item or "path" not in item:
                      continue
                  key = (item.get("path"), item.get("line_num"), item.get("typo"))
                  counts[key] += 1
                  review_item = {
                      "path": item.get("path"),
                      "line_num": item.get("line_num"),
                      "byte_offset": item.get("byte_offset"),
                      "occurrence_index": counts[key],
                      "typo": item.get("typo"),
                      "corrections": item.get("corrections", []) or [],
                      "status": "PENDING",
                      "correction": "",
                  }
                  review.write(json.dumps(review_item, ensure_ascii=True) + "\n")
          print("--- review.jsonl ---")
          with open("review.jsonl", "r", encoding="utf-8") as review:
              print(review.read(), end="")
          print("--- end review.jsonl ---")
          PY
          exit 0

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: typos-review-jsonl
          path: review.jsonl
          if-no-files-found: error
